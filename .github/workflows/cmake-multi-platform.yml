# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        if command -v sudo >/dev/null 2>&1; then
          SUDO="sudo"
        else
          SUDO=""
        fi
        export DEBIAN_FRONTEND=noninteractive
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          pkg-config \
          clang \
          libvulkan-dev \
          vulkan-tools \
          libfreetype6-dev \
          libcurl4-openssl-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          xorg-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          patchelf

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Package standalone tarball
      shell: bash
      run: |
        STAGING_DIR="${{ github.workspace }}/staging/openrequest"
        rm -rf "${{ github.workspace }}/staging"
        mkdir -p "${STAGING_DIR}/lib"
        mkdir -p "${STAGING_DIR}/fonts"

        # Copy executable
        cp "${{ steps.strings.outputs.build-output-dir }}/openrequest" "${STAGING_DIR}/openrequest.bin"

        # Copy bundled fonts
        if [ -d "${{ github.workspace }}/ext/imgui/misc/fonts" ]; then
          cp ${{ github.workspace }}/ext/imgui/misc/fonts/*.ttf "${STAGING_DIR}/fonts/" 2>/dev/null || true
        fi

        # Gather shared library dependencies recursively
        EXCLUDE_REGEX='(libc\.so|libm\.so|libdl\.so|libpthread\.so|ld-linux|librt\.so|libresolv\.so|libutil\.so)'

        gather_libs() {
          local file="$1"
          local libs
          libs=$(ldd "$file" 2>/dev/null | awk '{if ($3 ~ /^\//) print $3; else if ($1 ~ /^\//) print $1}' | grep -v -E "$EXCLUDE_REGEX" || true)
          for lib in $libs; do
            local base
            base=$(basename "$lib")
            if [ -f "$lib" ] && [ ! -f "${STAGING_DIR}/lib/$base" ]; then
              cp -L "$lib" "${STAGING_DIR}/lib/"
              gather_libs "$lib"
            fi
          done
        }

        gather_libs "${STAGING_DIR}/openrequest.bin"

        # Set RPATH so openrequest.bin finds bundled libraries in $ORIGIN/lib
        if command -v patchelf >/dev/null 2>&1; then
          patchelf --set-rpath '$ORIGIN/lib' "${STAGING_DIR}/openrequest.bin" || true
          for lib in "${STAGING_DIR}/lib/"*.so*; do
            if [ -f "$lib" ]; then
              patchelf --set-rpath '$ORIGIN' "$lib" 2>/dev/null || true
            fi
          done
        fi

        # Create launcher script
        printf '%s\n' \
          '#!/usr/bin/env bash' \
          'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
          'export LD_LIBRARY_PATH="$SCRIPT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
          'cd "$SCRIPT_DIR"' \
          'exec "$SCRIPT_DIR/openrequest.bin" "$@"' \
          > "${STAGING_DIR}/openrequest"
        chmod +x "${STAGING_DIR}/openrequest"

        # Create tarball
        TARBALL_NAME="openrequest-linux-${{ matrix.c_compiler }}-x86_64.tar.gz"
        tar -czvf "${{ github.workspace }}/$TARBALL_NAME" -C "${{ github.workspace }}/staging" openrequest
        echo "TARBALL_NAME=$TARBALL_NAME" >> "$GITHUB_ENV"

    - name: Upload standalone tarball artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: openrequest-linux-${{ matrix.c_compiler }}-x86_64
        path: ${{ env.TARBALL_NAME }}
