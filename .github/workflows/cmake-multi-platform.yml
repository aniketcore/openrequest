# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Canonical release matrix:
      # 1. Linux x86_64 (GCC)
      # 2. Windows x86_64 (MSVC)
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Skip Windows in act
      if: env.ACT == 'true' && matrix.os == 'windows-latest'
      run: echo "Skipping Windows build when running locally with act (act only runs Linux containers)"

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux' && matrix.os != 'windows-latest'
      run: |
        if command -v sudo >/dev/null 2>&1; then
          SUDO="sudo"
        else
          SUDO=""
        fi
        export DEBIAN_FRONTEND=noninteractive
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          pkg-config \
          clang \
          libvulkan-dev \
          vulkan-tools \
          libfreetype6-dev \
          libcurl4-openssl-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          xorg-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          patchelf

    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 'latest'
        install_runtime: true
        cache: true

    - name: Install dependencies via vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        vcpkg install --triplet x64-windows

    - name: Set reusable strings
      if: matrix.os != 'windows-latest' || env.ACT != 'true'
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      if: matrix.os != 'windows-latest' || env.ACT != 'true'
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -A x64 \
            -S "${{ github.workspace }}"
        else
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -S "${{ github.workspace }}"
        fi

    - name: Build
      if: matrix.os != 'windows-latest' || env.ACT != 'true'
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      if: matrix.os != 'windows-latest' || env.ACT != 'true'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Package standalone tarball (Linux)
      if: runner.os == 'Linux' && matrix.os != 'windows-latest'
      shell: bash
      run: |
        STAGING_DIR="${{ github.workspace }}/staging/openrequest"
        rm -rf "${{ github.workspace }}/staging"
        mkdir -p "${STAGING_DIR}/lib"
        mkdir -p "${STAGING_DIR}/fonts"

        # Copy executable
        cp "${{ steps.strings.outputs.build-output-dir }}/openrequest" "${STAGING_DIR}/openrequest.bin"

        # Copy bundled fonts
        if [ -d "${{ github.workspace }}/ext/imgui/misc/fonts" ]; then
          cp ${{ github.workspace }}/ext/imgui/misc/fonts/*.ttf "${STAGING_DIR}/fonts/" 2>/dev/null || true
        fi

        # Gather shared library dependencies recursively
        EXCLUDE_REGEX='(libc\.so|libm\.so|libdl\.so|libpthread\.so|ld-linux|librt\.so|libresolv\.so|libutil\.so)'

        gather_libs() {
          local file="$1"
          local libs
          libs=$(ldd "$file" 2>/dev/null | awk '{if ($3 ~ /^\//) print $3; else if ($1 ~ /^\//) print $1}' | grep -v -E "$EXCLUDE_REGEX" || true)
          for lib in $libs; do
            local base
            base=$(basename "$lib")
            if [ -f "$lib" ] && [ ! -f "${STAGING_DIR}/lib/$base" ]; then
              cp -L "$lib" "${STAGING_DIR}/lib/"
              gather_libs "$lib"
            fi
          done
        }

        gather_libs "${STAGING_DIR}/openrequest.bin"

        # Set RPATH so openrequest.bin finds bundled libraries in $ORIGIN/lib
        if command -v patchelf >/dev/null 2>&1; then
          patchelf --set-rpath '$ORIGIN/lib' "${STAGING_DIR}/openrequest.bin" || true
          for lib in "${STAGING_DIR}/lib/"*.so*; do
            if [ -f "$lib" ]; then
              patchelf --set-rpath '$ORIGIN' "$lib" 2>/dev/null || true
            fi
          done
        fi

        # Create launcher script
        printf '%s\n' \
          '#!/usr/bin/env bash' \
          'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
          'export LD_LIBRARY_PATH="$SCRIPT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
          'cd "$SCRIPT_DIR"' \
          'exec "$SCRIPT_DIR/openrequest.bin" "$@"' \
          > "${STAGING_DIR}/openrequest"
        chmod +x "${STAGING_DIR}/openrequest"

        # Create tarball
        PKG_FILE="openrequest-linux-x86_64.tar.gz"
        tar -czvf "${{ github.workspace }}/$PKG_FILE" -C "${{ github.workspace }}/staging" openrequest
        echo "PACKAGE_PATH=${{ github.workspace }}/$PKG_FILE" >> "$GITHUB_ENV"
        echo "PACKAGE_NAME=openrequest-linux-x86_64" >> "$GITHUB_ENV"

    - name: Package standalone tarball (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $StagingDir = "${{ github.workspace }}\staging\openrequest"
        if (Test-Path "${{ github.workspace }}\staging") { Remove-Item -Recurse -Force "${{ github.workspace }}\staging" }
        New-Item -ItemType Directory -Force -Path "$StagingDir" | Out-Null
        New-Item -ItemType Directory -Force -Path "$StagingDir\fonts" | Out-Null

        # Locate openrequest.exe
        $BuildDir = "${{ steps.strings.outputs.build-output-dir }}"
        $Exe = if (Test-Path "$BuildDir\Release\openrequest.exe") { "$BuildDir\Release\openrequest.exe" } else { "$BuildDir\openrequest.exe" }
        Copy-Item -Path $Exe -Destination "$StagingDir\openrequest.exe"

        # Copy runtime DLLs from build directory and vcpkg
        $ExeDir = Split-Path $Exe
        Get-ChildItem -Path $ExeDir -Filter "*.dll" | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination $StagingDir
        }
        if (Test-Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin") {
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" | ForEach-Object {
            if (-not (Test-Path "$StagingDir\$($_.Name)")) {
              Copy-Item -Path $_.FullName -Destination $StagingDir
            }
          }
        }

        # Copy fonts
        if (Test-Path "${{ github.workspace }}\ext\imgui\misc\fonts") {
          Copy-Item -Path "${{ github.workspace }}\ext\imgui\misc\fonts\*.ttf" -Destination "$StagingDir\fonts"
        }

        # Create tarball package
        $TarName = "openrequest-windows-x86_64.tar.gz"
        tar -czvf "${{ github.workspace }}\$TarName" -C "${{ github.workspace }}\staging" openrequest
        Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_PATH=${{ github.workspace }}\$TarName"
        Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=openrequest-windows-x86_64"

    - name: Upload standalone artifact
      if: env.ACT != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: ${{ env.PACKAGE_PATH }}

  release:
    name: Attach Release Tarballs
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload Tarballs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
